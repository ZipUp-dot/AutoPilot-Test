# ============================================================
# AutoPilot — AI 驱动的自动化测试平台
# Docker Compose 编排（MySQL + Backend + Frontend）
# ============================================================
#
# 启动:
#   docker compose up -d
#
# 首次启动后:
#   - MySQL 自动创建 autopilot 数据库
#   - Backend 启动时自动执行 schema.sql 建表
#   - 访问 http://localhost:8080 打开前端界面
#
# 停止:
#   docker compose down
#
# 停止并清理数据卷:
#   docker compose down -v
# ============================================================

version: "3.8"

services:
  # ═══════════════════════════════════════════════
  # MySQL 8.0 数据库
  # ═══════════════════════════════════════════════
  mysql:
    image: mysql:8.0
    container_name: autopilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-autopilot123}
      MYSQL_DATABASE: autopilot
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - autopilot-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-autopilot123}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ═══════════════════════════════════════════════
  # 后端服务 — FastAPI + Playwright
  # ═══════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autopilot-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 数据库
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-autopilot123}@mysql:3306/autopilot
      # AI（可选，不填则 Mock 模式）
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      # Playwright
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      PLAYWRIGHT_TIMEOUT: ${PLAYWRIGHT_TIMEOUT:-30000}
      MAX_HEAL_RETRY: ${MAX_HEAL_RETRY:-3}
      # 存储路径
      UPLOAD_DIR: /app/uploads
      REPORT_DIR: /app/reports
      SCREENSHOT_DIR: /app/uploads/screenshots
      VIDEO_DIR: /app/uploads/videos
      EXCEL_DIR: /app/uploads/excels
      # 服务器
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: >-
        ["http://localhost:8080","http://127.0.0.1:8080","http://localhost:80","http://frontend:80"]
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      # 绕过沙箱限制（Docker 环境也需要）
      TOOLHOST_SANDBOX_DISABLED: "true"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
      - reports_data:/app/reports
      - screenshots_data:/app/uploads/screenshots
    networks:
      - autopilot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ═══════════════════════════════════════════════
  # 前端服务 — Vue 3 + Nginx
  # ═══════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autopilot-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - autopilot-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ═══════════════════════════════════════════════
# 持久化数据卷
# ═══════════════════════════════════════════════
volumes:
  mysql_data:
    name: autopilot-mysql-data
  uploads_data:
    name: autopilot-uploads
  reports_data:
    name: autopilot-reports
  screenshots_data:
    name: autopilot-screenshots

# ═══════════════════════════════════════════════
# 内部网络
# ═══════════════════════════════════════════════
networks:
  autopilot-network:
    name: autopilot-network
    driver: bridge
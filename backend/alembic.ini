# ============================================================
# AutoPilot - Alembic database migration config
# Unified migration for BOTH MySQL / SQLite (SQLite uses render_as_batch=True)
#
# Common commands (run in backend/):
#   alembic upgrade head          # upgrade to latest
#   alembic downgrade base        # rollback to empty
#   alembic upgrade +1 / -1       # move one revision forward/backward
#   alembic current / history     # show current revision / history
#   alembic revision --autogenerate -m "desc"   # generate revision from ORM models
#
# Database URL resolution order (resolved dynamically in env.py):
#   1. env var AUTOPILOT_ALEMBIC_URL (for smoke tests / manual override)
#   2. DATABASE_URL from backend/.env or env vars
# NOTE: keep this file ASCII-only (locale encoding may be non-UTF8).
# ============================================================

[alembic]
# migration script directory (relative to backend/)
script_location = alembic
# sqlalchemy.url is resolved by env.py from app config; do NOT hardcode here.

# ---- logging config ----

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[pytest]
# ── Paths ──
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Asyncio ──
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# ── Markers ──
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests requiring TestClient
    unit: marks unit tests for isolated functions
    service: marks service-layer tests with mocked dependencies
    asyncio: marks tests as asyncio tests

# ── Coverage ──
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-branch
    --cov-report=term-missing
    --cov-report=html
    -p no:cacheprovider

# ── Coverage configuration ──
[coverage:run]
source = app
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    class .*\bProtocol\):
    except ImportError:
    # pragma: no cover
show_missing = True
precision = 2


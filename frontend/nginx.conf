# ============================================================
# AutoPilot Frontend — Nginx 配置
# 静态文件服务 + SPA 路由 + 后端 API 反向代理
# ============================================================

server {
    listen 80;
    server_name localhost;

    # 字符集
    charset utf-8;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── 前端静态文件 ──
    root /usr/share/nginx/html;
    index index.html;

    # ── 后端 API 反向代理 ──
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # 代码生成 / 执行可能较慢
        proxy_connect_timeout 10s;
    }

    # ── 静态报告文件（受控访问：nginx 附加内部令牌，Dockerfile 注入 __INTERNAL_API_TOKEN__） ──
    location /reports/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer __INTERNAL_API_TOKEN__";
    }

    # ── 上传文件（截图 / Excel）（受控访问：同上附加内部令牌） ──
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer __INTERNAL_API_TOKEN__";
    }

    # ── 健康检查（直通后端） ──
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # ── SPA 路由回退：非文件请求返回 index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 安全头 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}